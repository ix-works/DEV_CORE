# guard — proje reposu sunucu-tarafı savunması. ÇAĞIRICI; mantık core'dadır:
# `.github/workflows/project-guard.yml` (reusable workflow). init_project.py bunu üretir.
#
# ÜÇ İŞ (hepsi core'daki reusable workflow'da tanımlı):
#   (a) core-leak        : junction içeriği repoya girmiş mi? (R1/D26 — fikri sermaye)
#   (b) validators       : CI'da run_all_validators (core clone'lanır)
#   (c) behavior-surface : davranış-yüzeyi dosyaları main'e doğrudan push ile değişmiş mi?
#
# NEDEN ÇAĞIRICI: eskiden guard'ın TAMAMI her projeye kopyalanıyordu. Core'a eklenen
# `validators` job'u bir projeye elle eklendi, şablona hiç yansımadı (K2, 2026-07-10) ve
# hiçbir şey uyarmadı. Kopya = drift kaynağı. Artık job eklemek/değiştirmek için YALNIZ
# core'daki reusable workflow düzenlenir; tüm projeler bir sonraki koşuda otomatik alır.
#
# ⚠ `@main`e sabitli, `@stable`a DEĞİL — gerekçe project-guard.yml başlığında.
# ⚠ Buraya job EKLEME. Projeye özgü kontrol gerekiyorsa AYRI bir workflow dosyası aç.
name: guard

# TETİK SÖZLEŞMESİ — `push` DALSIZ BIRAKILMAZ (2026-08-13 ölçümü).
# Dalsız `push:` + `pull_request:` birlikte, PR dalına atılan her push'ta AYNI head SHA'yı
# İKİ ayrı koşuda doğrulur. Bir proje reposunun ard arda BEŞ PR döngüsünde ölçüldü:
# beşinde de branch-push ve pull_request koşuları aynı head SHA'yı doğruluyordu → PR başına
# 3 koşu × 3 job = 9 job; 3'ü saf çoğaltma. Kaybolan koruma YOK: silinen branch-push
# koşusunda `behavior-surface` zaten HİÇBİR ŞEY yapmıyordu (REF=refs/heads/<dal> ≠
# refs/heads/main → F1 bloğu atlanır; canlı log kanıtı: o koşunun çıktısı yalın "OK"),
# `core-leak`+`validators` ise aynı ağacı PR koşusunda zaten görüyor — üstelik PR koşusu
# BİRLEŞMİŞ ağacı (refs/pull/N/merge) doğrular, yani daha ilgili olanı.
# ⛔ `concurrency: cancel-in-progress` bu sınıfı ÇÖZMEZ — denendi ve ÖLÇÜLDÜ: branch-push
# koşusu, pull_request koşusu DOĞMADAN bitiyor (05:35:07→05:35:31 bitti, PR koşusu 05:35:33
# doğdu) → iptal edilecek koşu bulunmaz, tasarruf 0.
# Değişmez KORUNUR: main'e inen her şey ya PR koşusundan ya main-push koşusundan geçer.
# DEV_CORE'un kendi `core-ci.yml`'i baştan beri bu desendedir (kontrol grubu).
on:
  push:
    branches: [main]
  pull_request:

# Reusable workflow izinleri çağırandan devralır; `behavior-surface` job'u
# `gh api commits/{sha}/pulls` çağırır → `pull-requests: read` ŞART (yoksa 403 → yanlış-FAIL).
permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    uses: ix-works/DEV_CORE/.github/workflows/project-guard.yml@main
