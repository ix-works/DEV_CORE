# PROJE guard'ı — REUSABLE WORKFLOW (her proje bunu çağırır; mantık TEK yerde yaşar).
#
# NEDEN (2026-07-10 senkronizasyon denetimi): guard.yml her projeye KOPYALANIYORDU. Core'a
# eklenen `validators` job'u bir projeye elle eklendi, şablona hiç yansımadı (K2) ve hiçbir
# şey uyarmadı. Kopya = drift kaynağı. Artık projeler 6 satırlık bir çağırıcı tutar.
#
# Canlı kanıt (2026-07-10): bir PRIVATE proje reposu, PUBLIC core reposunun reusable
# workflow'unu çağırdı; koşu `success`, log'da `repo=<ORG>/<PROJECT_REPO>` → `github.*`
# bağlamı ÇAĞIRANI gösteriyor, `actions/checkout` çağıranın kodunu çekiyor.
#
# ⚠ Projeler bunu `@main`'e sabitler, `@stable`'a DEĞİL: `stable` tag'i elle taşınır ve
# bayatlar (2026-07-10'da main'in 49 commit gerisindeydi). Bayat bir ref, guard'ı sessizce
# eski tutardı — tam da kaldırmaya çalıştığımız drift. `@main`'in bedeli gürültülüdür:
# bozuk bir core commit'i projelerin CI'ını KIRMIZI yapar, sessizce geçmez.
#
# ⚠ TETİK BURADA YAŞAMAZ (`workflow_call`) — çağıranın `on:` bloğundadır. Çağıran sözleşmesi
# (2026-08-13): `push` DALSIZ bırakılmaz, `branches: [main]` ile daraltılır; yoksa PR dalına
# atılan her push aynı SHA'yı iki koşuda doğrular (ölçüm + neden: guard.template.yml başlığı).
# Aşağıdaki `behavior-surface` bu sözleşmeye DAYANIR: F1 bloğu yalnız `refs/heads/main`
# push'unda ve `pull_request`ta iş yapar, feature-dal push'unda zaten no-op'tur.
name: project-guard

on:
  workflow_call:

jobs:
  leak:
    name: core-leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tracked tree'de core/junction içeriği yok
        run: |
          # 'rules' 2026-07-10'da eklendi (L1b). Junction'lanan HER tip burada olmalı;
          # yoksa core içeriği sunucu tarafında yakalanmadan geçer.
          BAD=$(git ls-files -- 'core/**' '.claude/agents/**' '.claude/skills/**' '.claude/commands/**' '.claude/rules/**')
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::CORE SIZINTISI: junction içeriği repoya girmiş (R1/D26)"
            exit 1
          fi
          echo "OK — sızıntı yok"

  validators:
    # 2026-07-10 sağlık denetimi (statik katman ③): proje CI'ında run_all_validators HİÇ
    # koşmuyordu → validator'ların çoğu yalnız elle çalışıyordu. CI checkout'unda core/
    # YOK (junction + gitignore); core repo PUBLIC olduğu için auth'suz clone edilir.
    name: validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: core clone → core/ (junction yerine)
        run: |
          git clone --depth 1 https://github.com/ix-works/DEV_CORE.git core
          echo "core klonlandı: $(git -C core rev-parse --short HEAD)"
      - name: python bağımlılıkları
        run: pip install --quiet requests urllib3 || true
      # ⛔ SIRA ÖNEMLİ (DG-03, 2026-08-28): ÖN-KONTROL, REGENERATE'ten ÖNCE koşar.
      # Eskiden yalnız aşağıdaki regenerate adımı vardı ve C-IDX-01 doğrulaması
      # (run_all_validators → check_core_index_fresh --check) ondan SONRA geliyordu ⇒
      # kontrol DAİMA kendi az önce ürettiği dosyaya bakıyordu: **her koşum yeşil**,
      # CI'da C-IDX-01 hiçbir şey ölçmüyordu (kendi kendini doğrulayan backstop).
      - name: CORE-INDEX tazelik ÖN-KONTROLÜ (regenerate'ten ÖNCE — gerçek ölçüm)
        # `--ci-check` soruyu ancak CEVAPLANABİLİR olduğunda sorar: commit'li indeksin
        # damgasındaki `core-commit` ile fiilen klonlanan core HEAD'i AYNI ise gerçek
        # bayatlık kıyası yapar (fark → exit 1). Farklı commit'lerde ölçüm YAPILAMAZ
        # (doküman-kümesi farkı bayatlık DEĞİLDİR) → `SKIPPED measured=false` + exit 0.
        # Yani: sahte-yeşil YOK, uydurma-kırmızı da YOK.
        run: python core/scripts/build_core_index.py --ci-check

      - name: CORE-INDEX'i CLONE'lanan core'a göre yeniden üret
        # Bu adım ÖLÇÜM DEĞİL, HAZIRLIKTIR: aşağıdaki run_all_validators içindeki
        # check_core_index_fresh (--check) CI'nın fresh-clone core'una göre koşar ve
        # commit'li indeks başka bir core commit'ine göre üretilmişse yanlış-pozitif
        # verirdi. Gerçek C-IDX-01 ölçümü YUKARIDAKİ ön-kontrol adımıdır.
        run: python core/scripts/build_core_index.py || true
      - name: run_all_validators (profil-modlu; core + validators-local)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: python core/scripts/validators/run_all_validators.py

  behavior-surface:
    name: behavior-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: davranış-yüzeyi değişim kontrolü (F1)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SURFACE='CLAUDE.md */CLAUDE.md .claude/* .mcp.json project.yaml scripts/hook_shim.py'

          # ── Q199② FAIL-CLOSED ÖLÇÜM (2026-09-02) — BAŞLANGIÇ ──────────────────
          # ESKİDEN:  list_touched() { git diff --name-only "$1" "$2" -- $SURFACE 2>/dev/null || true; }
          #   `2>/dev/null` SEBEBİ, `|| true` de rc'yi (128) yutuyordu ⇒ TOUCHED='' ⇒
          #   hüküm ***"OK — davranış-yüzeyi dokunuşu yok"*** ⇒ F1 SESSİZCE AÇILIYORDU.
          #   Yani *"eşleşme yok"* ile *"komut çöktü"* AYIRT EDİLEMİYORDU (Q199① ile aynı sınıf).
          #   ÖLÇÜLEN TETİK: main'e force-push sonrası `github.event.before` ERİŞİLEMEZ bir
          #   objedir (`fetch-depth: 0` erişilemeyeni GETİRMEZ) → `git diff $BEFORE $AFTER`
          #   → rc=128 `fatal: bad object`.
          # ⚖ Doğru desen bu dosyada ZATEN vardı: `MERGED_PR=$(gh api … || echo 0)` — yokluk
          #   *"temiz"* değil ***"suçlu"*** demektir. Taklit edildi; o satırlara DOKUNULMADI.
          # ⛔ Bu yardımcılar `$( )` İÇİNDE ÇAĞRILAMAZ: `exit 1` alt-kabuğu öldürür ve
          #   `::error::` metni de yakalanıp KAYBOLUR (ölçüldü) ⇒ sonuçlarını GLOBAL yazarlar.
          olcemedim() {
            echo "::error::F1 ÖLÇÜLEMEDİ — $1. Davranış-yüzeyi kontrolü KOŞTURULAMADI; 'temiz' SAYILMAZ (fail-closed)."
            exit 1
          }
          # Commit objesi BU checkout'ta var mı? Buradaki `2>/dev/null` MEŞRUDUR: cevabı rc
          # TAŞIR, yutulan bir karar YOK (`|| true` bilerek YAZILMADI — yazılsaydı sonda).
          erisilir() {
            [ -n "$1" ] || return 1
            git cat-file -e "${1}^{commit}" 2>/dev/null
          }
          # Karşılaştırma tabanını seçer → TABAN / TABAN_ETIKET (global):
          #   ① olay yükünün tabanı erişilebilir  → DAVRANIŞ AYNEN ESKİSİ (sessiz, tek satır not)
          #   ② erişilemez (force-push'un NORMAL sonucu) → `$AFTER^` + GÖRÜNÜR `::notice::`
          #      ⚠ pencere DARALIR (yalnız son commit) — bu yüzden asla sessiz kalmaz
          #   ③ `$AFTER^` de yok (kök commit / sığ klon) → artık gerçekten bakamadık: fail-closed
          taban_belirle() {
            if erisilir "$1"; then
              TABAN="$1"
              TABAN_ETIKET="$2"
              echo "F1 tabanı: $2 = $1 (erişilebilir)"
              return 0
            fi
            if erisilir "${AFTER}^"; then
              TABAN="${AFTER}^"
              TABAN_ETIKET="\$AFTER^"
              echo "::notice::F1 TABANI DEĞİŞTİ — $2 ($1) bu checkout'ta ERİŞİLEMEZ (main'e force-push'un normal sonucu). Ölçüm tabanı: \$AFTER^ = $(git rev-parse "${AFTER}^") ⇒ pencere YALNIZ son commit'i kapsar."
              return 0
            fi
            olcemedim "karşılaştırma tabanı YOK — $2 ($1) erişilemez ve ${AFTER}^ de yok (kök commit / sığ klon)"
          }
          # → TOUCHED (global). rc AYRI yakalanır; stderr YUTULMAZ ve TOUCHED'e KARIŞTIRILMAZ
          # (git'in kendi hata metni doğrudan log'a akar; `2>&1` rc=0'daki bir uyarıyı
          # "dokunuldu" sanma riski doğururdu — Q199①'de de aynı gerekçeyle reddedilmişti).
          list_touched() {
            LT_RC=0
            TOUCHED=$(git diff --name-only "$1" "$2" -- $SURFACE) || LT_RC=$?
            if [ "$LT_RC" -ne 0 ]; then
              olcemedim "git diff rc=$LT_RC (taban=$1 hedef=$2)"
            fi
            return 0
          }
          # ── Q199② FAIL-CLOSED ÖLÇÜM — BİTİŞ ───────────────────────────────────

          if [ "$EVENT" = "pull_request" ]; then
            taban_belirle "$BASE" "PR base.sha"
            list_touched "$TABAN" "$AFTER"
            if [ -n "$TOUCHED" ]; then
              echo "$TOUCHED"
              echo "::warning::PR davranış-yüzeyi dosyası içeriyor — lider incelemesi şart (F1)"
            else
              echo "OK — davranış-yüzeyi dokunuşu yok (taban: $TABAN_ETIKET)"
            fi
            exit 0
          fi
          # push olayı: main'e merge-olmayan (doğrudan) push + davranış-yüzeyi = FAIL
          if [ "$REF" = "refs/heads/main" ]; then
            # Parent sayımı da bir ÖLÇÜMDÜR: çökerse blok sessizce atlanır ve F1 yine
            # fail-open olurdu (`$(… | wc -w)` git'in rc'sini yutar, boş girdide "0" basar).
            RL_RC=0
            RL_OUT=$(git rev-list --parents -n 1 "$AFTER") || RL_RC=$?
            if [ "$RL_RC" -ne 0 ]; then
              olcemedim "parent sayımı çöktü (git rev-list rc=$RL_RC, hedef=$AFTER)"
            fi
            PARENTS=$(printf '%s' "$RL_OUT" | wc -w)
            if [ "$PARENTS" -lt 3 ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              taban_belirle "$BEFORE" "github.event.before"
              list_touched "$TABAN" "$AFTER"
              if [ -n "$TOUCHED" ]; then
                # SQUASH-MERGE de tek-parent'lıdır (PARENTS<3) ama MERGED PR'dan gelir →
                # review'dan geçmiştir, F1'in engellemek istediği "bypass" DEĞİLDİR.
                MERGED_PR=$(gh api "repos/$REPO/commits/$AFTER/pulls" \
                              --jq '[.[]|select(.merged_at!=null)]|length' 2>/dev/null || echo 0)
                # api hata dönerse (403/JSON) sayısal-olmayan gelir → `-gt` çöker; sayıya zorla.
                echo "$MERGED_PR" | grep -qE '^[0-9]+$' || MERGED_PR=0
                if [ "${MERGED_PR:-0}" -gt 0 ]; then
                  echo "$TOUCHED"
                  echo "OK — davranış-yüzeyi değişti ama MERGED PR'dan geldi (F1 geçti; review disiplini korundu)"
                else
                  echo "$TOUCHED"
                  echo "::error::main'e DOĞRUDAN push davranış-yüzeyine dokunuyor (F1 — yalnız lider-onaylı PR)"
                  exit 1
                fi
              fi
            fi
          fi
          # ⚠ PAYDA: çıplak "OK" NE koşulduğunu söylemiyordu (Q199① dersi). Bu satıra
          # üç yoldan gelinir: main-dışı ref · merge-commit (PARENTS≥3) · yüzey dokunuşu yok.
          echo "OK — F1 kontrolü tamamlandı (olay=$EVENT ref=$REF)"
