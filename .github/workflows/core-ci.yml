# core-ci — DEV_CORE required-check (B12).
# Pre-commit gate'inin sunucu aynası: hook lokalde atlansa bile merge EDILEMEZ.
# Required-check baglama (B14 push + ilk yesil kosudan SONRA):
#   main-ruleset'e (id 18667766) "gates" job'u required_status_checks olarak eklenir + ruleset ENABLE edilir.
name: core-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 ZORUNLU (2026-08-29, kayit Q210 ileri-fix; CI run 33265820879).
      # Parametresiz `checkout` SIG klon yapar (fetch-depth 1) -> repoda YALNIZ 1 commit
      # bulunur. Fixture korpusunun bir bolumu mutasyon TABANINI pinli bir SHA'dan alir
      # (`git show <sha>:<yol>`); sig klonda o blob'lar YOK -> kosucu `exit 2` ile durur.
      # Olculdu: suit BOLUM 4 (kip kosabilirligi) CI'da 28/34, ayni sig klon yerelde
      # taklit edilince BIREBIR 28/34 + ayni 6 kosucu. Yani kip korpusunun %18'i CI'da
      # HIC kosmuyordu; kipler yalnizca sessizce curuyordu (BOLUM 4 tam da bunu
      # gormek icin yazilmisti ve ilk isinde kendi ortamini tespit etti).
      # MALIYET: `git count-objects -vH` -> size-pack 6.93 MiB / 233 commit; tam gecmis
      # ihmal edilebilir. Kardes is akisi `project-guard.yml` zaten `fetch-depth: 0`
      # kullaniyor (emsal, icat degil).
      # ⛔ BU SATIR PINLI-SHA TABANINI YENIDEN MESRULASTIRMAZ: (a) `git show HEAD:` hala
      # YASAK -- zamana baglidir, fix merge edilince taban=fix olur (PR #177/#179'da iki
      # kez main'i kirdi); (b) squash-merge ile ERISILEMEZ kalan bir SHA burada da
      # bulunamaz -- fetch-depth 0 yalnizca REF'lerden erisilebilir gecmisi getirir.
      # Bugunku 5 pinli SHA'nin besi de main'in atasi oldugu olculdu.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python-dotenv: `scripts/sap_adt_lib.py` onu ust-duzeyde import eder. Bugune dek
      # CI'da gerekmiyordu cunku hicbir adim modulu IMPORT etmiyordu (compileall yalnizca
      # DERLER, import etmez) -> eksik bagimlilik gorunmezdi. CSRF regresyon testi
      # sap_adt_lib'i gercekten import ettigi icin artik zorunlu.
      - name: Bagimliliklar
        run: pip install --quiet requests urllib3 python-dotenv

      # D1 (2026-07-10): kimlik blocklist'i `.git/genericize-blocklist`te yasar ve ASLA
      # klonlanmaz -> CI taze klon yaptigi icin liste hic yuklenmiyordu; public repoya
      # giden SON KAPI musteri/sistem/kisi adina kordu. Secret zorunlu; yoksa gate
      # fail-closed durur (script exit 1).
      - name: Genericize-leak + link-audit + applies_to sema (TAM AGAC)
        env:
          IX_GENERICIZE_BLOCKLIST: ${{ secrets.IX_GENERICIZE_BLOCKLIST }}
        run: python scripts/git-hooks/core_precommit.py --all

      - name: Validators (CORE modu)
        run: python scripts/validators/run_all_validators.py

      - name: Derleme taramasi (py_compile)
        run: python -m compileall -q scripts mcp_servers

      # IMPORT smoke (2026-07-28): compileall yalnizca DERLER — eksik ucuncu-parti
      # bagimlilik GORUNMEZ kalir. Nitekim `python-dotenv` repo omru boyunca CI'da
      # eksikti ve ancak sap_adt_lib'i gercekten import eden ilk test yazilinca patladi.
      # Bu adim ana modulleri ICE AKTARIR -> eksik bagimlilik ANINDA gorunur.
      - name: Import smoke (eksik bagimlilik erken yakala)
        run: python -c "import sys; sys.path.insert(0,'scripts'); import sap_adt_lib, sap_client, object_types; print('import smoke OK')"


      # Guard regresyonu: yanlis-pozitif kapali MI + gercek koruma ayakta MI + ikinci
      # kabuk yuzeyi (PowerShell) kapali MI. Kosmayan test gate degildir.
      # Ag/proje bagimli senaryolar (PUBLIC-PR canli gorunurluk, freeze kokleri)
      # burada otomatik atlanir; tam kosum icin IX_GUARD_TEST_LIVE=1 + repo env'leri.
      - name: Guard yuzeyi regresyonu (pre_tool_guard)
        run: python scripts/tests/test_pre_tool_guard.py

      # 2026-08-01 (bug-avi AV-16 yan-bulgusu): bu test 2026-07-28'de yazildi ve
      # infra-changelog'a "test_commit_message_leak_gate (CI)" diye KAYDEDILDI —
      # ama CI'a hic baglanmamisti. Uc gun sonra ayni gate `git commit -am` ile
      # atlatildi, hicbir kirmizi isik yanmadi. Kod != kablolama; kosmayan test
      # gate degildir. Agsiz (monkeypatch'li), ~1sn.
      - name: Commit-mesaji sizinti gate regresyonu
        run: python scripts/tests/test_commit_message_leak_gate.py

      # CSRF header enjeksiyonu regresyonu (2026-07-28 canli vaka): cagiranlarin cogu
      # header'i `_request_with_csrf_retry`'dan ONCE kuruyor; soguk session'da token
      # o dict'e HIC yazilmiyordu -> istek CSRF'siz gidiyor, bazi ADT uclari 403 yerine
      # 200 + yaniltici govde donduruyor (classrun "does not implement") -> 403'e bakan
      # retry hic tetiklenmiyor, hata "obje bozuk" gibi gorunuyor. Agsiz test.
      # A/B kanitli: kok-fix devre disi birakilinca exit 1, geri alininca exit 0.
      - name: CSRF header enjeksiyonu regresyonu
        run: python scripts/tests/test_csrf_header_injection.py

      # Push readback regresyonu (2026-07-28 canli vaka): CDS'te gecersiz `"` yorumu ->
      # SAP kaynagi SESSIZCE reddetti; run_review/abaplint/validators/syntax_check/push
      # BESI DE yesil verdi, kaynak canliya hic inmedi. push_object readback kiyasini
      # yapiyordu ama yalnizca WARNING basip 'success' True donduruyordu.
      # Test BICIM (pretty-print, gecer) ile ICERIK (gercek uyusmazlik, duser) ayrimini
      # kilitler + KABLOLAMAYI dogrular. Sabotaj-kanitli: helper VEYA success ifadesi
      # bozulunca exit 1.
      - name: Push readback ayrimi regresyonu
        run: python scripts/tests/test_push_readback_mismatch.py

      # META-GATE (2026-07-10 saglik denetimi): her guard kurali icin ③tetiklenmeli /
      # ④tetiklenmemeli + kablolama + "kanitsiz kural = FAIL". Sahte-gate sinifini
      # yapisal olarak imkansiz kilar. template_project'i de kapsar (iki-proje matrisi).
      # Once Z4 oz-testi kosar: harness notr guard'a yesil basarsa CI kirilir (harness bozuk).
      # SONRA TAM konformans: template_project (public) clone edilip GERCEK guard'a karsi
      # kosulur → ③④ + KABLOLAMA + META-GATE (kanitsiz kural = FAIL) burada zorlanir.
      # Yalniz --self-test-only meta-gate'i gercek guard'a uygulamaz (notr stub'i okur).
      # G1 (2026-07-31): HARD validator fixture korpusu — bad→FAIL, good→PASS.
      # "Kontrol kostu != kontrol bakti" ailesine yapisal panzehir; ilk 10 validator.
      - name: Validator fixture testleri (G1 negatif-test korpusu)
        run: python tests/run_fixture_tests.py

      - name: template_project clone (tam konformans icin)
        run: git clone --depth 1 https://github.com/ix-works/template_project.git ../template_project
      - name: Guard konformans matrisi (self-test + TAM ucuncu-proje)
        run: |
          python scripts/tests/guard_conformance.py --self-test-only
          python scripts/tests/guard_conformance.py --project ../template_project
