# checklist-map.yaml — checklist maddesi → kontrol eşlemesi (checklist_check.py okur)
#
# Her madde: id · sinif (A = kaynak metinden kesin tespit · B = SAP/çalışma zamanı sorgusu · C = yalnız yargı)
# · uygulanir (glob; `/` içermeyen desen dosya ADINA, içeren desen repo-göreli yola eşlenir)
# · kontrol (checklist_check.py'deki fonksiyon kimliği; C'de yalnız `ip_` önekli İPUCU tarayıcısı — hüküm vermez)
# · seviye (blok = FAIL'de exit 1; ADR 0019 gereği YALNIZ BE-10b · uyari · bilgi)
# · yazan_kanali (kuralı kodu YAZAN ajanın okuduğu core-göreli dosya; `--reach` denetler)
# Ek alanlar: not (gerekçe/kısmi kapsam) · ayrildi (checklist metni henüz yazılmamış ayrılmış kimlik)
# · tum_dosya (diff kipinde değişmeyen satırdaki bulgu da FAIL kalır) · capa (yazan_kanali'nda ID yerine aranacak metin)
#
# Seviye ilkesi: checklist HIGH/BLOCKER → uyari; MEDIUM/LOW/WARNING → bilgi. Bloklamak bu dosyanın değil
# ADR 0019 onayının işidir. Tutarlılık: `python scripts/validators/checklist_check.py --harita-denetim`.
#
# ⚠ Bu dosya PyYAML OLMADAN okunur (CI kurmaz): yalnız blok-liste + `anahtar: değer` + akış listesi
# `[a, "b"]` + çift tırnaklı dize. Çok satırlı değer, çapa/takma ad, iç içe eşleme KULLANMA.

